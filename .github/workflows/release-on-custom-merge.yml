name: Release custom build

on:
  pull_request:
    branches:
      - custom/master
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: custom-release-${{ github.event.pull_request.merge_commit_sha || github.sha }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out custom branch
        uses: actions/checkout@v5
        with:
          ref: custom/master
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Determine fork version
        id: version
        run: |
          set -euo pipefail
          existing_tag="$(git tag --points-at HEAD --list 'v*-fork.*' | sort -V | tail -1)"
          if [ -n "${existing_tag}" ]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "tag=${existing_tag}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          upstream_tag="$(git tag --merged origin/master --list 'v*' | grep -v -- '-fork\.' | sort -V | tail -1 || true)"
          if [ -n "${upstream_tag}" ]; then
            base_version="${upstream_tag#v}"
            upstream_base="${upstream_tag}"
          else
            base_version="$(node -p "require('./package.json').version")"
            upstream_base="package.json v${base_version}"
          fi

          last_number="$(git tag --list "v${base_version}-fork.*" | sed -E 's/.*-fork\.([0-9]+)$/\1/' | sort -n | tail -1)"
          next_number="$(( ${last_number:-0} + 1 ))"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "tag=v${base_version}-fork.${next_number}" >> "${GITHUB_OUTPUT}"
          echo "upstream_base=${upstream_base}" >> "${GITHUB_OUTPUT}"
      - name: Install dependencies
        if: steps.version.outputs.skip != 'true'
        run: npm install
      - name: Build Chrome and Firefox packages
        if: steps.version.outputs.skip != 'true'
        run: |
          set -euo pipefail
          browser=chrome npm run build:prod
          browser=firefox npm run build:prod
          mkdir -p release-assets
          cp dist/production/chrome/sk.zip "release-assets/surfingkeys-chrome-${{ steps.version.outputs.tag }}.zip"
          cp dist/production/firefox/sk.zip "release-assets/surfingkeys-firefox-${{ steps.version.outputs.tag }}.zip"
      - name: Publish fork release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          UPSTREAM_BASE: ${{ steps.version.outputs.upstream_base }}
        run: |
          set -euo pipefail
          git tag "${TAG}" HEAD
          git push origin "refs/tags/${TAG}"
          gh release create "${TAG}" release-assets/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Surfingkeys ${TAG}" \
            --notes "Fork build from \`custom/master\`. Upstream base: ${UPSTREAM_BASE}."
