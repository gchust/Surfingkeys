name: Node CI

on:
  push:
    branches:
      - master
      - custom/master
  pull_request:
    branches:
      - custom/master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build Chrome extension
        run: npm run build:prod
        env:
          CI: true
