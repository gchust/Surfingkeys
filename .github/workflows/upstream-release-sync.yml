name: Sync upstream

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-master-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: brookhong/Surfingkeys
  MIRROR_BRANCH: master
  CUSTOM_BRANCH: custom/master

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fork maintenance branch
        uses: actions/checkout@v4
        with:
          ref: custom/master
          fetch-depth: 0

      - name: Mirror upstream branch and tags
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" 2>/dev/null || true
          git fetch upstream "${MIRROR_BRANCH}" --tags
          git push origin "refs/remotes/upstream/${MIRROR_BRANCH}:refs/heads/${MIRROR_BRANCH}"

          while IFS= read -r tag; do
            [ -n "${tag}" ] || continue
            if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
              git push origin "refs/tags/${tag}"
            fi
          done < <(git tag --points-at "refs/remotes/upstream/${MIRROR_BRANCH}")

      - name: Create or update the sync pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin "${MIRROR_BRANCH}" "${CUSTOM_BRANCH}"
          if git merge-base --is-ancestor "origin/${MIRROR_BRANCH}" "origin/${CUSTOM_BRANCH}"; then
            echo "custom branch already contains the latest upstream commit"
            exit 0
          fi

          pr_number="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${CUSTOM_BRANCH}" \
            --head "${GITHUB_REPOSITORY_OWNER}:${MIRROR_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "${pr_number}" ]; then
            pr_url="$(gh pr create \
              --repo "${GITHUB_REPOSITORY}" \
              --base "${CUSTOM_BRANCH}" \
              --head "${MIRROR_BRANCH}" \
              --title "chore: sync upstream master" \
              --body "Automated sync from \`${UPSTREAM_REPOSITORY}:${MIRROR_BRANCH}\` into \`${CUSTOM_BRANCH}\`.")"
            pr_number="${pr_url##*/}"
          fi

          if ! gh pr merge "${pr_number}" --repo "${GITHUB_REPOSITORY}" --auto --merge; then
            echo "Auto-merge could not be enabled. PR #${pr_number} remains open for manual review."
          fi
